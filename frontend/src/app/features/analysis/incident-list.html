<section class="card" aria-labelledby="incidents-title">
  <div class="card-head">
    <h2 id="incidents-title">Incidentes</h2>
    <span class="card-note">Por severidad</span>
  </div>

  <ul class="incident-list">
    @for (incident of incidents(); track incident.id) {
      <li>
        <button
          type="button"
          class="incident incident-open"
          [attr.data-level]="incident.level_key"
          [attr.data-incident-id]="incident.id"
          [attr.aria-current]="selectedId() === incident.id ? 'true' : 'false'"
          (click)="selected.emit(incident.id)"
        >
          <span class="incident__top">
            <span class="level" [attr.data-level]="incident.level_key">{{ incident.level }}</span>
            <span class="incident__id">{{ incident.id }}</span>
          </span>
          <span class="incident__title">{{ incident.title }}</span>
          <span class="incident__meta">
            <span class="num">{{ clock(incident.first_seen) }} a {{ clock(incident.last_seen) }}</span>
            <span class="num">
              {{ incident.event_count }} {{ incident.event_count === 1 ? 'evento' : 'eventos' }}
            </span>
            <span class="num">
              {{ incident.entities.users.length }}
              {{ incident.entities.users.length === 1 ? 'cuenta' : 'cuentas' }}
            </span>
            <span class="num">
              {{ incident.entities.hosts.length }}
              {{ incident.entities.hosts.length === 1 ? 'equipo' : 'equipos' }}
            </span>
            @if (incident.requires_validation) {
              <span class="incident__flag incident-validation">Requiere validación</span>
            }
          </span>
        </button>
      </li>
    } @empty {
      <li class="incident-empty">No se detectaron incidentes en este export.</li>
    }
  </ul>
</section>
