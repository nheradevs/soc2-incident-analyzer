<header class="site-header" [class.is-stuck]="stuck()">
  <div class="site-header__inner">
    <a class="brand" routerLink="/cargar" aria-label="Análisis SOC 2, ir a la carga">
      <img src="logo-nhera.png" alt="Nhera" width="280" height="145" />
      <span class="brand__name">Análisis SOC 2</span>
    </a>
    <nav class="nav" aria-label="Pantallas">
      <a
        routerLink="/cargar"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Cargar</a
      >
      <a
        routerLink="/analisis"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Análisis</a
      >
      <a
        routerLink="/informe"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Informe</a
      >
    </nav>
  </div>
</header>

<main class="app-main">
  <div class="page">
    <router-outlet />
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="footer-id">
      <div class="byline">
        <span class="byline__name">Karen Gil</span>
        <span class="byline__role">Analista SOC 2</span>
      </div>
      <p class="footer-note">Proyecto final DOJO-WoSEC</p>
    </div>
    <nav class="footer-links" aria-label="Perfiles de Karen Gil">
      <a href="https://github.com/nheradevs" aria-label="GitHub de Karen Gil" title="GitHub">
